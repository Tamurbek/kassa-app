name: Build & Release (Android & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Windows
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Git for long paths
        run: git config --global core.longpaths true

      - name: Build Windows
        run: |
          flutter build windows --release

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows/vc_redist.x64.exe"

      - name: Get Version from pubspec.yaml
        id: get_version
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml | Select-String "^version: "
          $version = $versionLine.ToString().Split(":")[1].Trim().Split("+")[0]
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Found version: $version"

      - name: Create Installer (Inno Setup)
        shell: pwsh
        run: iscc /DMyAppVersion=${{ steps.get_version.outputs.VERSION }} windows/installer.iss

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: simple-sale-windows-setup
          path: build/windows/x64/runner/Release/installer/SimpleSale_Setup.exe

  # Job 2: Android
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: simple-sale-android
          path: build/app/outputs/flutter-apk/app-release.apk

  # Job 3: Create Release
  create-release:
    name: Create Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: simple-sale-windows-setup

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: simple-sale-android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SimpleSale_Setup.exe
            app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Railway Server
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip 'v' prefix for the backend
          VERSION_CLEAN="${VERSION#v}"
          
          echo "Uploading SimpleSale_Setup.exe directly to Railway..."
          # Direct file upload works even for Private repositories
          curl -v -f -X POST \
            -F "file=@SimpleSale_Setup.exe" \
            "https://web-production-d2ed7.up.railway.app/update/upload?version=${VERSION_CLEAN}&changelog=Yangi%20v${VERSION_CLEAN}%20versiyasi%20chiqarildi.%20Tizim%20barqarorligi%20va%20xavfsizligi%20oshirildi."
