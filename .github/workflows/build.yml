name: Build & Release (Android & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Windows Build & Release
  build-windows:
    name: Windows Build & Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Git for long paths
        run: git config --global core.longpaths true

      - name: Build Windows
        run: |
          flutter build windows --release

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows/vc_redist.x64.exe"

      - name: Get Version from pubspec.yaml
        id: get_version
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml | Select-String "^version: "
          $version = $versionLine.ToString().Split(":")[1].Trim().Split("+")[0]
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Found version: $version"

      - name: Create Installer (Inno Setup)
        shell: pwsh
        run: iscc /DMyAppVersion=${{ steps.get_version.outputs.VERSION }} windows/installer.iss

      - name: Create GitHub Release & Upload Windows
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/windows/x64/runner/Release/installer/SimpleSale_Setup.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Railway Server
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $VERSION_CLEAN = $VERSION.Replace("v", "")
          $FILE_URL = "https://github.com/${{ github.repository }}/releases/download/$VERSION/SimpleSale_Setup.exe"
          
          Write-Host "Notifying Railway about version $VERSION_CLEAN..."
          curl.exe -X POST -G `
            --data-urlencode "version=$VERSION_CLEAN" `
            --data-urlencode "url=$FILE_URL" `
            --data-urlencode "changelog=Yangi v$VERSION_CLEAN versiyasi chiqarildi. Barqarorlik va UI yaxshilanishlari mavjud." `
            "https://web-production-d2ed7.up.railway.app/update/remote"

  # Job 2: Android Build & Release
  build-android:
    name: Android Build & Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
